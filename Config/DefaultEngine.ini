[/Script/Engine.RendererSettings]
; ---------------------------------------------------------------------------
; The whole brief in one block: cheap geometry, expensive light. Everything
; below is chosen to spend the frame on GI, shadows, reflections and fog.
; ---------------------------------------------------------------------------

; Lumen for both GI and reflections, on hardware ray tracing.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.RayTracing=True
r.RayTracing.EnableInGame=True
r.RayTracing.UseTextureLod=True
; The engine hard-asserts if ray tracing is on without this, even in a project with no
; skeletal meshes at all. It costs shader compile time and nothing at runtime here.
r.SkinCache.CompileShaders=True

; Virtual shadow maps everywhere; no cascades to tune, no shadow acne budget.
r.Shadow.Virtual.Enable=1

; MegaLights: the reason hundreds of emissive fixtures can each cast shadows.
r.MegaLights.EnableForProject=1

; Static lighting has no place here - every light moves with the day cycle.
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True

; Sky, fog and shafts.
r.SupportSkyAtmosphereAffectsHeightFog=1
r.VolumetricFog=1
r.DefaultFeature.LightUnits=2

; Nanite stays available but off by default - see DECISIONS.md. At this triangle
; count the cluster overhead costs more than it saves.
r.Nanite.ProjectEnabled=True

; Tonemapping and grading.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
; Lights here are authored in lux, so exposure has to be authored in EV100 to match.
; Without this the min and max exposure are raw luminance and a sunlit scene clips white.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Lumen caches lighting against a fixed pre-exposure. The default of 4 covers EV [-8, 12]
; and clips at noon here; 8 covers EV [-4, 16], which is the range the sky director drives.
r.EyeAdaptation.CachedLightingPreExposure=8.0
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AntiAliasing=4
r.TSR.ShadingRejection.Flickering=1

; Forward shading off - deferred is required for Lumen and MegaLights.
r.ForwardShading=False
r.VelocityOutputPass=1
r.CustomDepth=3
vr.InstancedStereo=False

[SystemSettings]
; Slate throttles rendering while the user interacts with UI. That is editor behaviour; in
; a game it halves the framerate exactly while the player is reading the performance
; settings, which is the worst possible moment to mislead them.
Slate.bAllowThrottling=0

; GC assumption verification is on by default outside Shipping and walks every object on
; every collect - a four second frame in the packaged build. A budget you cannot measure
; is not a budget.
gc.VerifyAssumptions=0

; Local fog volumes are invisible within 10 m of the camera by default, which would hide
; both the ground dust at the player's own feet and a drone's rotor wash passing directly
; overhead - the two places the effect matters most.
r.LocalFogVolume.GlobalStartDistance=200

[/Script/Engine.Engine]
; The engine draws a red "PROFILING WITH AI LOGGING ON" banner over the game whenever stats
; are being collected, which the performance HUD does by design. There is no AI logging to
; collect in a project with no AI controllers, so turn it off rather than live with the banner.
bDisableAILogging=True
