[/Script/Engine.InputSettings]
; Enhanced Input is the only input path in this project. Registering its classes here is
; what makes APlayerController hand the pawn an EnhancedInputComponent to bind against.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Legacy input scales predate Enhanced Input and silently multiply look input by 2.5.
; Off, so a mouse delta reaches the camera as authored and LookSensitivity means what it says.
bEnableLegacyInputScales=False

; Raw mouse. Smoothing and acceleration both fight a first-person camera.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False

bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bAlwaysShowTouchInterface=False
